services:
  mysql:
    image: mysql:8.0
    container_name: sanguo-editor-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sanguo_editor
      MYSQL_USER: sanguo
      MYSQL_PASSWORD: sanguo
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - sanguo-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usanguo", "-psanguo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sanguo-mysql-data:
